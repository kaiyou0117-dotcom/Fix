<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>―</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background:#ffffff; color:#111;
    font-family:'Hiragino Sans', 'Yu Gothic', sans-serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
  }
  .wrap{ padding:8vh 6vw; }

  .gotcha-title{
    font-weight:900; font-size:clamp(2.4rem, 10vw, 4.6rem);
    letter-spacing:0.02em; line-height:1.25; color:#111;
  }
  .gotcha-note{
    margin-top:18px; font-size:0.8rem; color:#555;
  }

  .buttons{ margin-top:48px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-block; padding:14px 30px;
    border:1px solid #111; color:#111; font-size:0.85rem; letter-spacing:0.04em;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .btn:hover{ background:#111; color:#fff; }
</style>
</head>
<body>

  <div class="wrap">
    <div class="gotcha-title">釣られたな？罠だよポッター。</div>
    <p class="gotcha-note">……というのは冗談で、この先は未完成です。</p>

    <div class="buttons">
      <a class="btn" href="index.html">トップに戻る</a>
      <a class="btn" href="#" id="prevBtn">前のページに戻る</a>
    </div>
  </div>

  <script>
    document.getElementById('prevBtn').addEventListener('click', function(e){
      e.preventDefault();
      history.go(-2);
    });
  </script>

</body>
</html>
