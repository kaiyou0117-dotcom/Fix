<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS DENIED ― フィクサー協会</title>
<meta name="theme-color" content="#7a1015">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Shippori+Mincho+B1:wght@500;800&family=Noto+Serif+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0808;
    --void-2:#161010;
    --bone:#dcd5ca;
    --bone-dim:#8f8378;
    --red:#c81e2e;
    --red-deep:#7a1015;
    --red-glow:#ff3d3d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    background:var(--void); color:var(--bone);
    font-family:'Noto Serif JP', serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; position:relative;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .flash{
    position:fixed; inset:0; z-index:20; background:#fff;
    opacity:0; pointer-events:none;
  }
  .flash.play{ animation:flashOnce 0.5s ease-out 1; }
  @keyframes flashOnce{
    0%{ opacity:0; }
    8%{ opacity:1; }
    100%{ opacity:0; }
  }

  .beacon{
    position:fixed; top:50%; left:50%; width:1px; height:1px; z-index:0; pointer-events:none;
    animation:spin 4s linear infinite;
  }
  .beacon::before{
    content:""; position:absolute; top:0; left:0; width:1400px; height:1400px;
    margin:-700px 0 0 -700px;
    background:conic-gradient(from 0deg, rgba(200,30,46,0.16), transparent 18deg, transparent 342deg, rgba(200,30,46,0.16));
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  body.shake{ animation:shake 0.4s linear; }
  @keyframes shake{
    0%{ transform:translate(0,0); }
    20%{ transform:translate(-7px,4px); }
    40%{ transform:translate(6px,-5px); }
    60%{ transform:translate(-5px,5px); }
    80%{ transform:translate(4px,-3px); }
    100%{ transform:translate(0,0); }
  }

  .scanlines{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:repeating-linear-gradient(to bottom, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 1px, transparent 1px, transparent 3px);
    opacity:0.4; mix-blend-mode:multiply;
  }
  .vignette{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:inset 0 0 140px rgba(200,30,46,0.28); }
    50%{ box-shadow:inset 0 0 220px rgba(200,30,46,0.5); }
  }

  .wrap{ position:relative; z-index:2; text-align:center; padding:6vh 6vw; max-width:640px; }

  .icon{ margin:0 auto 26px; width:64px; height:64px; }
  .icon svg{ width:100%; height:100%; }
  .icon path, .icon line{ stroke:var(--red); }

  .title{
    font-family:'Cinzel', serif; font-weight:700; font-size:clamp(2rem,7vw,3.2rem);
    letter-spacing:0.12em; color:var(--red-glow);
    text-shadow:2px 0 rgba(200,30,46,0.6), -2px 0 rgba(122,16,21,0.6);
    animation:glitch 2.4s infinite steps(1);
  }
  @keyframes glitch{
    0%, 92%, 100%{ text-shadow:2px 0 rgba(200,30,46,0.6), -2px 0 rgba(122,16,21,0.6); transform:translate(0,0); }
    93%{ text-shadow:-4px 1px rgba(200,30,46,0.7), 4px -1px rgba(122,16,21,0.7); transform:translate(-2px,0); }
    95%{ text-shadow:3px -1px rgba(200,30,46,0.7), -3px 1px rgba(122,16,21,0.7); transform:translate(2px,0); }
    97%{ text-shadow:none; transform:translate(0,0); }
  }

  .subtitle{
    margin-top:14px; font-family:'Shippori Mincho B1', serif; font-weight:800;
    font-size:1.1rem; color:var(--bone); letter-spacing:0.04em;
  }

  .log{
    margin-top:36px; text-align:left; font-size:0.72rem; line-height:2.1;
    color:var(--bone-dim); background:var(--void-2);
    border-left:2px solid var(--red-deep); padding:18px 22px;
  }
  .log .line{ min-height:1.6em; }
  .log .line .ok{ color:var(--red); }
  @keyframes lineIn{ to{ opacity:1; } }

  .footer-note{
    margin-top:34px; font-size:0.64rem; color:var(--bone-dim); letter-spacing:0.04em;
    opacity:0; transition:opacity 0.6s ease;
  }
  .footer-note.show{ opacity:1; }

  .back-link{
    display:inline-block; margin-top:26px;
    font-family:'Cinzel', serif; font-size:0.68rem; letter-spacing:0.12em;
    color:var(--bone); border:1px solid var(--bone-dim);
    padding:12px 30px;
    opacity:0;
    transition:opacity 0.6s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .back-link.show{ opacity:1; }
  .back-link:hover{ background:var(--red-deep); border-color:var(--red-deep); color:var(--bone); }

  .rec{
    position:fixed; top:20px; left:22px; z-index:3;
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:0.62rem; color:var(--red);
    letter-spacing:0.06em;
  }
  .rec .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); animation:blink 1.1s infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.2; } }

  .session{ margin-top:10px; font-size:0.62rem; color:var(--bone-dim); opacity:0.75; letter-spacing:0.02em; }

  /* ===== pre-intro: detection sequence ===== */
  .detect{
    position:fixed; inset:0; z-index:50;
    background:#000;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.25s ease, visibility 0.25s ease;
  }
  .detect.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .detect-text{
    font-family:'JetBrains Mono', monospace; font-size:clamp(1.2rem,4vw,1.8rem);
    letter-spacing:0.08em; color:var(--red);
    text-shadow:2px 0 rgba(200,30,46,0.7), -2px 0 rgba(122,16,21,0.7);
  }

  .main-content{ opacity:0; transition:opacity 0.4s ease; }
  .main-content.show{ opacity:1; }
</style>
</head>
<body>

  <div class="detect" id="detect">
    <div class="detect-text mono" id="detectText">検出中<span class="cd-dots">...</span></div>
  </div>

  <div class="flash" id="postFlash"></div>
  <div class="beacon"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="main-content" id="mainContent">
    <div class="rec"><span class="dot"></span>REC ● SESSION MONITORED</div>

    <div class="wrap">
      <div class="icon">
        <svg viewBox="0 0 64 64" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M32 6 L58 20 V38 C58 50 46 58 32 60 C18 58 6 50 6 38 V20 Z"/>
        <line x1="32" y1="24" x2="32" y2="38"/>
        <line x1="32" y1="44" x2="32" y2="45"/>
      </svg>
    </div>

    <div class="title">ACCESS DENIED</div>
    <div class="subtitle">不正な侵入者を感知しました</div>
    <div class="session mono" id="sessionLine"></div>

    <div class="log mono" id="logBox">
      <div class="line" data-text="[ WARN ] 認証プロトコルへの異常なアクセスを検知"></div>
      <div class="line" data-text="[ WARN ] セッションの正当性を確認できませんでした"></div>
      <div class="line" data-text="[ EXEC ] 対象セッションを強制終了します" data-shake="1"></div>
      <div class="line" data-text="[ DONE ] アクセス記録を協会本部へ送信しました"></div>
    </div>

      <p class="footer-note">この一連の記録は保全され、必要に応じて関係部署へ照会されます。</p>

      <a class="back-link" href="gotcha.html">戻る</a>
    </div>
  </div>

  <script>
    function startMainSequence(){
      document.getElementById('mainContent').classList.add('show');

      var now = new Date();
      var pad = function(n){ return n.toString().padStart(2,'0'); };
      var sessionId = Math.random().toString(16).slice(2,10).toUpperCase();
      document.getElementById('sessionLine').textContent =
        'SESSION #' + sessionId + '  ' + now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) +
        ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

      var lines = document.querySelectorAll('#logBox .line');
      var delay = 400;
      lines.forEach(function(line){
        var full = line.getAttribute('data-text');
        var tag = full.match(/^\[ (\w+) \]/)[1];
        var rest = full.slice(full.indexOf(']') + 1);
        setTimeout(function(){
          var i = 0;
          line.innerHTML = '[ <span class="ok">' + tag + '</span> ]';
          var span = document.createElement('span');
          line.appendChild(span);
          var typer = setInterval(function(){
            span.textContent = rest.slice(0, i);
            i++;
            if (i > rest.length){
              clearInterval(typer);
              if (line.getAttribute('data-shake')){
                document.body.classList.add('shake');
                setTimeout(function(){ document.body.classList.remove('shake'); }, 400);
              }
            }
          }, 18);
        }, delay);
        delay += full.length * 18 + 260;
      });

      setTimeout(function(){
        document.querySelector('.footer-note').classList.add('show');
      }, delay + 100);
      setTimeout(function(){
        document.querySelector('.back-link').classList.add('show');
      }, delay + 400);
    }

    (function(){
      var detect = document.getElementById('detect');
      var detectText = document.getElementById('detectText');
      var postFlash = document.getElementById('postFlash');

      var steps = [
        { msg: '検出中<span class="cd-dots">...</span>', delay: 0,    shake: false },
        { msg: '異常なパターンを確認',                    delay: 550,  shake: true  },
        { msg: 'SYSTEM ERROR',                            delay: 500,  shake: true  },
        { msg: '回線を切断します',                          delay: 480,  shake: false }
      ];

      var elapsed = 0;
      steps.forEach(function(step, idx){
        elapsed += step.delay;
        setTimeout(function(){
          detectText.innerHTML = step.msg;
          if (step.shake){
            document.body.classList.add('shake');
            setTimeout(function(){ document.body.classList.remove('shake'); }, 400);
          }
        }, elapsed);
      });

      var totalDelay = elapsed + 500;
      setTimeout(function(){
        detect.classList.add('hide');
        postFlash.classList.add('play');
        startMainSequence();
      }, totalDelay);
    })();
  </script>

</body>
</html>
